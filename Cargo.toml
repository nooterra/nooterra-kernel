[workspace]
resolver = "2"
members = [".", "crates/nooterra-wasm"]

[package]
name = "nooterra-kernel"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/nooterra/nooterra-kernel"
homepage = "https://nooterra.ai"
description = "no_std proof verifier for Nooterra .ntcert multiphysics, geometry, DFM/DFA, tolerance, and COTS assembly certificates"

# The kernel crate carries no external dependencies.
[dependencies]

# Trap on integer overflow in release builds.
[profile.release]
overflow-checks = true
lto = true
codegen-units = 1
opt-level = 3
